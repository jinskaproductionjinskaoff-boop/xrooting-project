<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Intelligence | DarkGPT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-dark text-white">
    <!-- Header -->
    <header class="bg-black py-4">
        <div class="container text-center">
            <h1 class="display-4 fw-bold">OSINT Intelligence</h1>
            <p class="lead">Analyse avancée avec DarkGPT</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <!-- User Form Section -->
            <div class="col-lg-8">
                <div class="card bg-dark border-light mb-4">
                    <div class="card-header bg-black text-center">
                        <h3>Informations Utilisateur</h3>
                    </div>
                    <div class="card-body">
                        <form id="userForm" class="row g-3 needs-validation" novalidate>
                            <!-- Nom -->
                            <div class="col-md-6">
                                <label for="lastName" class="form-label">Nom</label>
                                <input type="text" class="form-control bg-dark border-light text-white" id="lastName" required>
                                <div class="invalid-feedback">Veuillez entrer votre nom.</div>
                            </div>

                            <!-- Prénom -->
                            <div class="col-md-6">
                                <label for="firstName" class="form-label">Prénom</label>
                                <input type="text" class="form-control bg-dark border-light text-white" id="firstName" required>
                                <div class="invalid-feedback">Veuillez entrer votre prénom.</div>
                            </div>

                            <!-- Adresse -->
                            <div class="col-12">
                                <label for="address" class="form-label">Adresse complète</label>
                                <textarea class="form-control bg-dark border-light text-white" id="address" rows="2" required></textarea>
                                <div class="invalid-feedback">Veuillez entrer votre adresse.</div>
                            </div>

                            <!-- Numéro de téléphone -->
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Numéro de téléphone</label>
                                <input type="tel" class="form-control bg-dark border-light text-white" id="phone" required>
                                <div class="invalid-feedback">Format: +33612345678</div>
                            </div>

                            <!-- Options -->
                            <div class="col-md-6 d-flex align-items-end">
                                <div class="form-check form-switch ms-auto">
                                    <input class="form-check-input" type
