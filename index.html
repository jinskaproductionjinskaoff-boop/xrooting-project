<script>
  const fiches = [
    {
      nom: "DUPONT",
      prenom: "GILBERT",
      source: "Donnée fictive de démonstration"
    },
    {
      nom: "MARTIN",
      prenom: "JEAN",
      source: "Donnée fictive de démonstration"
    },
    {
      nom: "DURAND",
      prenom: "MARIE",
      source: "Donnée fictive de démonstration"
    }
  ];

  function rechercher() {
    const nom = document.getElementById("nom").value.trim().toLowerCase();
    const prenom = document.getElementById("prenom").value.trim().toLowerCase();
    const resultat = document.getElementById("result");

    const fiche = fiches.find(f =>
      (nom === "" || f.nom.toLowerCase() === nom) &&
      (prenom === "" || f.prenom.toLowerCase() === prenom)
    );

    if (fiche) {
      resultat.innerHTML = `
        <div class="result-title">Fiche trouvée</div>

        <div class="line">
          <div class="label">Nom</div>
          <div class="value">${fiche.nom}</div>
        </div>

        <div class="line">
          <div class="label">Prénom</div>
          <div class="value">${fiche.prenom}</div>
        </div>

        <div class="line">
          <div class="label">Source</div>
          <div class="value">${fiche.source}</div>
        </div>

        <div class="notice">
          Fiche de démonstration — aucune donnée personnelle réelle.
        </div>
      `;

      resultat.style.display = "block";
    } else {
      resultat.innerHTML = `
        <div class="result-title">Aucun résultat</div>
        <div class="notice">
          Aucune fiche correspondante dans la base de démonstration.
        </div>
      `;

      resultat.style.display = "block";
    }
  }
</script>
