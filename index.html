<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XrootProject | Cyber Intelligence Hub</title>
    <style>
        :root {
            --primary: #00f7ff;
            --dark: #0a0e2a;
            --secondary: #16213e;
            --accent: #ff00ff;
            --glow: 0 0 15px rgba(0, 247, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background: linear-gradient(135deg, #0a0e2a 0%, #16213e 50%, #0a0e2a 100%);
            color: var(--primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            background: rgba(12, 14, 42, 0.8);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--glow);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: var(--glow);
        }

        .logo::after {
            content: " [XROOT]";
            color: var(--accent);
        }

        .user-stats {
            display: flex;
            gap: 1rem;
        }

        .stat {
            background: rgba(22, 33, 62, 0.5);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
        }

        .auth-section {
            flex: 1;
            background: rgba(22, 33, 62, 0.6);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: var(--glow);
        }

        .auth-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }

        .auth-title::after {
            content: " [ACCESS]";
            color: var(--accent);
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

        .input-group input {
            background: rgba(12, 14, 42, 0.7);
            border: none;
            padding: 0.8rem;
            border-radius: 4px;
            color: var(--primary);
            font-family: monospace;
        }

        .input-group input::placeholder {
            color: rgba(0, 247, 255, 0.6);
        }

        button {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border: none;
            padding: 1rem;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .toggle-auth {
            text-align: center;
            margin-top: 1rem;
        }

        .toggle-auth a {
            color: var(--primary);
            text-decoration: none;
        }
