<!DOCTYPE html>

<title>Snap Bomber</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#111;min-height:100vh;display:grid;place-items:center}

  }
  .card{

  }
  .main{flex:1 1 auto;min-width:0}

  .brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .ghost{width:46px;height:46px;flex:0 0 auto;filter:drop-shadow(0 1px 0 #e5dc00)}
  .brandtxt h1{font-size:23px;font-weight:800;letter-spacing:.3px;line-height:1.1;color:#0d0d0d}
  .brandtxt p{font-size:11.5px;color:#8a8a8a;font-weight:500;margin-top:3px}
  .brandtxt p b{color:#8a8a8a;font-weight:600}

  .lbl{display:block;font-size:12px;font-weight:500;color:#6f6f6f;margin-bottom:6px}
  .lbl.tight{margin-top:18px}
  .field{
    width:100%;font-family:inherit;font-size:13.5px;color:#2b2b2b;
    background:#FCFAEA;border:1px solid #E4DFBE;border-radius:10px;
    padding:11px 13px;outline:none;transition:.15s;
  }
  .field:focus{border-color:#FFC61A;background:#FFFDF2;box-shadow:0 0 0 3px rgba(255,198,26,.22)}
  #user{margin-bottom:14px}
  .selwrap{position:relative;margin-bottom:16px}
  .sel{appearance:none;cursor:pointer;padding-right:34px}
  .caret{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none}

  .btnrow{display:flex;align-items:center;gap:10px}
  .btn{
    font-family:inherit;font-size:12.5px;font-weight:600;color:#fff;
    border:0;border-radius:9px;padding:9px 17px;cursor:pointer;transition:.15s;
  }
  .btn.start{background:#FF9F1C}
  .btn.start:hover{background:#F08C00}
  .btn.start:disabled{background:#F3C88B;cursor:not-allowed}
  .btn.stop{background:#F2556F}
  .btn.stop:hover{background:#DE3D59}
  .btn.reset{background:#F6F2DC;color:#5a5a5a;margin-left:auto}
  .btn.reset:hover{background:#EDE7C6}

  .track{height:11px;background:#F6F2DC;border-radius:99px;overflow:hidden;margin-top:2px}
  .fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#FFC61A,#FF9F1C);transition:width .18s linear}
  .counts{display:flex;justify-content:space-between;font-size:11.5px;color:#7a7a7a;margin-top:7px;font-weight:500}
  .goal{color:#8f8f8f}

  .conshead{font-size:12px;font-weight:700;margin-top:16px;margin-bottom:7px;color:#2b2b2b}
  .tri{color:#FFB300;font-size:12px}
